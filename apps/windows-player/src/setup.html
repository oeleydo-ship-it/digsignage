<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
        />
        <title>DigSignage Windows Player</title>
        <link rel="icon" href="./logo.svg" type="image/svg+xml" />
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: Segoe UI, system-ui, sans-serif;
                background: #0b0b0f;
                color: #f4f4f5;
            }
            .card {
                width: min(440px, calc(100vw - 48px));
                text-align: center;
            }
            .brand {
                width: 72px;
                height: 72px;
                margin: 0 auto 8px;
                border-radius: 18px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            }
            .brand img {
                display: block;
                width: 100%;
                height: 100%;
            }
            p.kicker {
                letter-spacing: 0.3em;
                text-transform: uppercase;
                font-size: 12px;
                color: #a1a1aa;
            }
            h1 {
                margin: 12px 0 8px;
                font-size: 28px;
            }
            p.help {
                color: #a1a1aa;
                font-size: 14px;
                line-height: 1.5;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                margin: 20px 0 16px;
                padding: 12px 14px;
                border: 1px solid #3f3f46;
                border-radius: 8px;
                background: #18181b;
                color: inherit;
                font-size: 16px;
            }
            button {
                border: 0;
                border-radius: 8px;
                padding: 12px 18px;
                background: #f4f4f5;
                color: #18181b;
                font-weight: 600;
                cursor: pointer;
            }
            .error {
                min-height: 20px;
                color: #fca5a5;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="brand">
                <img src="./logo.svg" alt="DigSignage" />
            </div>
            <p class="kicker">Windows player</p>
            <h1>Connect this display</h1>
            <p class="help">
                Enter the DigSignage server URL, then pair this window from the
                dashboard.
            </p>
            <input id="server" type="url" value="http://127.0.0.1:8000" />
            <button id="start" type="button">Open player</button>
            <p class="error" id="error"></p>
        </div>
        <script src="./setup.js"></script>
    </body>
</html>
